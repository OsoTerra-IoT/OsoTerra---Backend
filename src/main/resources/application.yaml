spring:
  application:
    name: ososense-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ososense}
    username: ${DB_USERNAME:ososense}
    password: ${DB_PASSWORD:ososense}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 19
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}

app:
  security:
    jwt:
      # Local-only default. Override with a real secret (JWT_SECRET) in every other environment.
      secret: ${JWT_SECRET:vlBw3pXcBi/t/g6v65zlzSOxKSjw37Ukb3Up5vq1jfdBCZ5lzMiP3meI33nAq9nr}
      expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
    stripe:
      webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  mail:
    from: ${MAIL_FROM:no-reply@osoterra.com}
  cors:
    # Comma-separated origin patterns allowed to call the API (Web App dev server and GitHub Pages).
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*,https://osoterra-iot.github.io}
  edge:
    # Shared key the Edge Service sends in X-Edge-Api-Key. Local-only default; override with EDGE_API_KEY.
    api-key: ${EDGE_API_KEY:local-edge-key}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
