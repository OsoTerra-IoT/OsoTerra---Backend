server:
  # Railway assigns the port through PORT.
  port: ${PORT:8080}

spring:
  application:
    name: ososense-backend
  datasource:
    # DB_* overrides; otherwise the PG* variables Railway's PostgreSQL injects; otherwise local defaults.
    url: ${DB_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:ososense}}
    username: ${DB_USERNAME:${PGUSER:ososense}}
    password: ${DB_PASSWORD:${PGPASSWORD:ososense}}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 19
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}

app:
  cors:
    # Comma-separated origin patterns allowed to call the API from a browser.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*,https://osoterra-iot.github.io,https://oso-terra-web-application.vercel.app}
  security:
    jwt:
      # Local-only default. Override with a real secret (JWT_SECRET) in every other environment.
      secret: ${JWT_SECRET:vlBw3pXcBi/t/g6v65zlzSOxKSjw37Ukb3Up5vq1jfdBCZ5lzMiP3meI33nAq9nr}
      expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
    stripe:
      webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  mail:
    from: ${MAIL_FROM:no-reply@osoterra.com}
  edge:
    # Shared key the Edge Service sends in X-Edge-Api-Key. Local-only default; override with EDGE_API_KEY.
    api-key: ${EDGE_API_KEY:local-edge-key}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
